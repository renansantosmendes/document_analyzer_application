name: CI

# Runs pylint on the package and on the tests, then the test suite, on every
# pull request and on every push to main. Make the "Tests and pylint" check
# required in the branch protection rules of main.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Tests and pylint (Python 3.13)
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up uv and Python 3.13
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          activate-environment: true
          enable-cache: true
          cache-dependency-glob: requirements*.txt

      - name: Install dependencies
        run: uv pip install -r requirements-dev.txt

      - name: pylint on the package (must score 10/10)
        run: pylint document_analyzer --fail-under=10

      - name: pylint on the tests
        run: >
          pylint tests
          --disable=missing-function-docstring,missing-class-docstring,too-few-public-methods,redefined-outer-name,unused-argument,line-too-long
          --fail-under=10

      - name: Run the tests
        run: python -m pytest -q
